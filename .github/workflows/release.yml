name: Build & Release WinIsleSetup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versi Release Tag (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build WinIsleSetup.exe & WinIsleSetup.zip
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: WinIsleSetup-Package
          path: |
            release/WinIsleSetup.zip
            release/WinIsleSetup.exe

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: WinIsle ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## WinIsle Dynamic Island for Windows
            Unduh **`WinIsleSetup.zip`** di bawah ini, ekstrak, lalu jalankan **`WinIsleSetup.exe`** untuk menginstal Dynamic Island di Windows Anda (tanpa perlu mengunduh source code).
          files: |
            release/WinIsleSetup.zip
            release/WinIsleSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
