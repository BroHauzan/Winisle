name: Build & Release WinIsleSetup

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Versi Release Tag (contoh: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Build Web App (Vite)
        run: npm run build

      - name: Verify Web Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "CRITICAL: dist/index.html does not exist! Vite build failed."
            exit 1
          }
          Write-Host "Vite build verified! dist/index.html exists."

      - name: Build Desktop Server
        run: node scripts/generate-tray-icon.mjs && node scripts/build-server.mjs

      - name: Verify Server Dist
        shell: pwsh
        run: |
          if (-not (Test-Path "dist-server/server.cjs")) {
            Write-Error "CRITICAL: dist-server/server.cjs does not exist!"
            exit 1
          }
          Write-Host "Server build verified! dist-server/server.cjs exists."

      - name: Build WinIsleSetup.exe via Electron Builder
        run: npx --yes electron-builder --win nsis --x64 --publish never

      - name: Package WinIsleSetup.zip
        run: node scripts/package-release-zip.mjs

      - name: Upload Artifacts to Workflow Run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WinIsleSetup-Package
          path: |
            release/*.zip
            release/*.exe
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.1.0' }}
          name: WinIsle ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.1.0' }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            ## WinIsle Dynamic Island for Windows
            Unduh **`WinIsleSetup.zip`** di bawah ini, ekstrak, lalu jalankan **`WinIsleSetup.exe`** untuk menginstal Dynamic Island di Windows Anda (tanpa perlu mendownload source code).
          files: |
            release/*.zip
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
